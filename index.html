<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Highway Rash — 3D Motorcycle Combat Racing</title>
<style>
:root{--ink:#f4f0e6;--hot:#ff4d2e;--gold:#ffc83d;--panel:rgba(12,14,22,.72)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0f1c;color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none;padding:max(12px,env(safe-area-inset-top)) 14px 14px}
.stat{position:absolute;top:max(12px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));background:var(--panel);padding:8px 14px;border-left:4px solid var(--hot);border-radius:4px}
.stat b{display:block;font:italic 900 28px/1 Impact,"Arial Black",sans-serif;letter-spacing:.5px}
.stat small{opacity:.75;font-size:12px}
#hp{position:absolute;top:max(12px,env(safe-area-inset-top));right:14px;width:min(40vw,240px)}
body.touch #hp{right:calc(var(--u)*.75 + 24px + env(safe-area-inset-right))}
.bar{height:14px;background:rgba(0,0,0,.55);border:2px solid #fff3;border-radius:3px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff3b2e,#ffb02e 50%,#5bdc5b)}
#riv i{background:#ff4d2e}#riv{opacity:0;transition:opacity .2s}
#spd{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);text-align:center;background:var(--panel);padding:6px 22px 8px;border-radius:6px;min-width:150px}
#spd b{font:italic 900 40px/1 Impact,"Arial Black",sans-serif;color:var(--gold)}
#spd i{font-style:normal;font-size:12px;opacity:.8;margin-left:4px}
#spd .bar i{background:var(--gold)}
#toast{position:absolute;top:30%;width:100%;text-align:center;font:italic 900 clamp(30px,7vw,64px) Impact,"Arial Black",sans-serif;color:var(--gold);text-shadow:3px 3px 0 #000;opacity:0;transition:opacity .25s}
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:rgba(5,8,16,.9);padding:20px}
.screen.on{display:flex}
h1{margin:0;font:italic 900 clamp(46px,11vw,110px)/.9 Impact,"Arial Black",sans-serif;color:var(--ink);text-shadow:4px 4px 0 var(--hot),8px 8px 0 #000a}
h2{margin:0 0 10px;font:italic 900 clamp(40px,9vw,84px) Impact,"Arial Black",sans-serif;color:var(--hot);text-shadow:3px 3px 0 #000}
p{margin:10px 0;max-width:520px;line-height:1.5}
button.go{pointer-events:auto;margin-top:18px;font:italic 900 24px Impact,"Arial Black",sans-serif;padding:12px 38px;background:var(--hot);color:#fff;border:0;border-radius:4px;box-shadow:0 5px 0 #8a1f0d;cursor:pointer}
button.go:active{transform:translateY(3px);box-shadow:0 2px 0 #8a1f0d}
.keys{font-size:14px;opacity:.85}
.keys kbd{background:#fff2;padding:2px 7px;border-radius:3px;border:1px solid #fff4}
#touch{display:none;position:fixed;inset:0;pointer-events:none}
body.touch #touch{display:block}body.touch .keys{display:none}
#snd{position:absolute;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);pointer-events:auto;width:44px;height:44px;border-radius:50%;border:2px solid #fff4;background:var(--panel);font-size:20px;cursor:pointer;color:#fff}

/* ---- touch controls: sized from --u so they scale with the screen ---- */
:root{--u:clamp(54px,min(17vh,12vw),92px);--g:14px;--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-bottom,0px)}
#pausebtn,body.touch #joy,body.touch .tb{touch-action:none}
#pausebtn{display:none;position:absolute;top:max(12px,env(safe-area-inset-top));right:calc(14px + var(--sr));width:calc(var(--u)*.75);height:calc(var(--u)*.75);min-width:44px;min-height:44px;border-radius:50%;border:2px solid #fff6;background:var(--panel);color:#fff;pointer-events:auto;padding:0}
#pausebtn svg{width:50%;height:50%}
body.touch #pausebtn{display:flex;align-items:center;justify-content:center}
#joy{position:absolute;right:calc(var(--g) + var(--sr));bottom:calc(var(--g) + var(--sb));width:calc(var(--u)*2.7);height:calc(var(--u)*2.7);pointer-events:auto;border-radius:50%}
#joy::before{content:"";position:absolute;inset:calc(var(--u)*.22);border-radius:50%;background:radial-gradient(circle,#ffffff14,#10131fb0);border:3px solid #fff7;box-shadow:0 0 0 2px #0005}
#joy::after{content:"◀      ▶";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;white-space:pre;font-size:calc(var(--u)*.26);color:#fff9;pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:calc(var(--u)*.95);height:calc(var(--u)*.95);margin:calc(var(--u)*-.475) 0 0 calc(var(--u)*-.475);border-radius:50%;background:radial-gradient(circle at 35% 30%,#7fb0ff,#2563eb);border:3px solid #fff;box-shadow:0 4px 8px #0008;pointer-events:none}
.tb{position:absolute;pointer-events:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:50%;color:#fff;border:3px solid #fff;opacity:.9;box-shadow:0 4px 0 #0008;font:900 11px Impact,sans-serif;text-shadow:0 1px 2px #000;transition:transform .05s}
.tb svg{width:42%;height:42%;filter:drop-shadow(0 1px 1px #000)}
.tb small{font-size:clamp(9px,calc(var(--u)*.15),13px);letter-spacing:.4px}
.tb.on{background:#fff!important;color:#111;text-shadow:none;transform:scale(.93)}.tb.on svg{filter:none}
.jl{position:absolute;left:0;right:0;text-align:center;font:900 normal clamp(9px,calc(var(--u)*.17),13px) Impact,sans-serif;color:#fffc;text-shadow:0 1px 2px #000;pointer-events:none;letter-spacing:.5px}
.jl.up{top:calc(var(--u)*.3)}.jl.dn{bottom:calc(var(--u)*.3)}
.tb.atk{width:calc(var(--u)*1.2);height:calc(var(--u)*1.2)}
.tb.punch{background:#ff7a00;left:calc(var(--g) + var(--sl));bottom:calc(var(--g) + var(--sb))}
.tb.kick{background:#9333ea;left:calc(var(--g)*2 + var(--sl) + var(--u)*1.2);bottom:calc(var(--g)*2 + var(--sb) + var(--u)*.7)}
@media (orientation:portrait){
  #spd{bottom:auto;top:calc(max(12px,env(safe-area-inset-top)) + 116px);min-width:130px;padding:3px 18px 5px}#spd b{font-size:32px}
  body.touch #hp{top:calc(max(12px,env(safe-area-inset-top)) + 64px);right:14px;left:14px;width:auto}
}
@media (max-height:420px){#spd{padding:3px 14px 5px}#spd b{font-size:30px}.stat{padding:5px 10px}.stat b{font-size:22px}}
.screen{overflow-y:auto}
#adbox{margin:16px 0 18px;text-align:center}
#adbox:not(:empty)::before{content:"ADVERTISEMENT";display:block;font-size:10px;letter-spacing:1px;opacity:.6;margin-bottom:4px}
#adbox ins{display:inline-block;width:300px;height:250px}
@media (max-height:520px){#adbox ins{width:320px;height:50px}#adbox{margin:8px 0 12px}}
</style>
<!-- Google AdSense: script is loaded here, but the ad unit is only created on the game-over screen (see showAd in src/main.ts) -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-11903444047315asasd68"
     crossorigin="anonymous"></script>
</head>
<body>
<div id="hud">
  <div class="stat"><b id="score">0</b><small><span id="dist">0</span> m · level <span id="lvl">1</span></small></div>
  <div id="hp"><small>HEALTH</small><div class="bar"><i id="hpbar"></i></div><div class="bar" id="riv"><i id="rivbar"></i></div></div>
  <div id="spd"><b id="kmh">0</b><i>km/h</i><div class="bar"><i id="spdbar" style="width:0"></i></div></div>
  <div id="toast"></div>
  <button id="pausebtn" aria-label="Pause"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg></button>
  <button id="snd" aria-label="Toggle sound">🔊</button>
</div>
<div id="touch">
  <div id="joy" aria-label="Drive joystick"><i class="jl up">▲ GAS</i><i class="jl dn">▼ STOP</i><div id="knob"></div></div>
  <div class="tb atk punch" data-k="pl"><svg viewBox="0 0 32 32" fill="currentColor"><path d="M7 12a3 3 0 0 1 3-3h14a3 3 0 0 1 3 3v8a8 8 0 0 1-8 8h-4a8 8 0 0 1-8-8z"/><path d="M3 14h5v8H3z"/><path d="M13 9v7M18 9v7M23 10v6" stroke="#10131f" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg><small>PUNCH</small></div>
  <div class="tb atk kick" data-k="kr"><svg viewBox="0 0 32 32" fill="currentColor"><path d="M10 2h8l1 14 9 5a3 3 0 0 1-1 6H12a3 3 0 0 1-3-3z"/><path d="M2 8h5M1 13h6M3 18h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><small>KICK</small></div>
</div>
<div class="screen on" id="menu">
  <h1>HIGHWAY<br>RASH</h1>
  <p>Race through traffic, outrun the road gangs and knock rival bikers off their rides. Keep your health above zero.</p>
  <p class="keys"><kbd>↑</kbd><kbd>↓</kbd> gas / brake · <kbd>←</kbd><kbd>→</kbd> steer · <kbd>Z</kbd> punch left · <kbd>X</kbd> kick right · <kbd>M</kbd> mute</p>
  <button class="go" id="start">RIDE</button>
</div>
<div class="screen" id="pause">
  <h2>PAUSED</h2>
  <button class="go" id="resume">RESUME</button>
  <button class="go" id="restart" style="background:#334">RESTART</button>
</div>
<div class="screen" id="over">
  <h2>WIPED OUT</h2>
  <p>Score <b id="fscore">0</b> · <span id="fdist">0</span> m · <span id="fko">0</span> knockouts<br>Best <b id="best">0</b></p>
  <div id="adbox" data-slot="0000000000"></div>
  <button class="go" id="again">RIDE AGAIN</button>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
